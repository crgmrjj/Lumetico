<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="100%" height="100%">
  <defs>
    <!-- Gradiente de fondo del escudo -->
    <radialGradient id="bgGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#090d16"/>
    </radialGradient>

    <!-- Gradiente del cuerpo verde de Lumen -->
    <linearGradient id="lumenGreen" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#84cc16"/>
      <stop offset="100%" stop-color="#22c55e"/>
    </linearGradient>

    <!-- Resplandor de Luz Ética -->
    <radialGradient id="luzGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#facc15" stop-opacity="1"/>
      <stop offset="50%" stop-color="#eab308" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#facc15" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- Escudo / Botón base redondeado -->
  <rect width="120" height="120" rx="30" fill="url(#bgGlow)" stroke="#38bdf8" stroke-width="2.5" stroke-opacity="0.4"/>

  <!-- Halo de resplandor trasero -->
  <circle cx="60" cy="62" r="38" fill="url(#luzGlow)" opacity="0.35"/>

  <!-- Antenas brillantes -->
  <!-- Antena Izquierda -->
  <path d="M 68 50 Q 60 38 61 28" fill="none" stroke="#22c55e" stroke-width="3" stroke-linecap="round"/>
  <circle cx="61" cy="27" r="7" fill="url(#luzGlow)"/>
  <circle cx="61" cy="27" r="4.5" fill="#facc15"/>

  <!-- Antena Derecha -->
  <path d="M 78 50 Q 82 35 90 29" fill="none" stroke="#22c55e" stroke-width="3" stroke-linecap="round"/>
  <circle cx="90" cy="28" r="7" fill="url(#luzGlow)"/>
  <circle cx="90" cy="28" r="4.5" fill="#facc15"/>

  <!-- Cuerpo de Lumen (Segmentos curvos estilo tu diseño) -->
  <circle cx="28" cy="74" r="13" fill="url(#lumenGreen)"/>
  <circle cx="43" cy="71" r="14" fill="url(#lumenGreen)"/>
  <circle cx="59" cy="68" r="15" fill="url(#lumenGreen)"/>

  <!-- Cabeza de Lumen -->
  <circle cx="77" cy="62" r="17" fill="url(#lumenGreen)"/>

  <!-- Mejilla sonrojada -->
  <circle cx="85" cy="67" r="3.5" fill="#f87171" opacity="0.8"/>

  <!-- Ojo grande estilo cómic/amigable -->
  <circle cx="75" cy="58" r="5" fill="#ffffff"/>
  <circle cx="76.5" cy="58" r="2.8" fill="#0f172a"/>
  <circle cx="75.5" cy="56.5" r="1.2" fill="#ffffff"/>

  <!-- Sonrisa -->
  <path d="M 79 66 Q 84 70 87 65" fill="none" stroke="#14532d" stroke-width="2" stroke-linecap="round"/>

  <!-- Destello de Luz / Chispa ética -->
  <polygon points="100,60 102,65 107,67 102,69 100,74 98,69 93,67 98,65" fill="#facc15"/>
</svg>
